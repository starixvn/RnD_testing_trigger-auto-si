stages: 
  - testMain

build:
  stage: testMain
  tags:
    - docker-automation-test
  variables:
    LIST_GAME: "1 2 22 9 24 28 4 6 10 27 7 3 26 23 25 35 21 38 39 42 29 47 46 31 45 48 50"
  script:
    - apk add jq
    - arr=${GAMEID//,/ }
    - >
      if [ "$GAMEID" == "ALL" ] ;then
            for i in $LIST_GAME ; do
            isRun=1
            isReady=0
              while [[ $isReady == 0 ]] ; do
                countStatus=$(curl --header "PRIVATE-TOKEN:9as_okfsbL9DWFxkBKjt" "https://git3.nexdev.net/api/v4/projects/783/pipelines?scope=running" | jq length)
                echo "current job running ${countStatus}"
                if [ $countStatus -lt $TOTALRUNNER ] ;then
              isReady=1
              echo "game name ${i}"
              curl -X POST -F token=f74a05850e77822eae68eb6c359a55 -F ref=5-new-test-base-of-slot-game -F variables[GAMEID]=$i -F variables[ENV]=$ENV -F variables[parentTrigger]=$CI_PIPELINE_ID https://git3.nexdev.net/api/v4/projects/783/trigger/pipeline
              sleep 2
            else
             sleep 20
            fi
                  sleep 2
          done
          done
          fi

      if [ "$GAMEID" != "ALL" ] ;then
            for i in $GAMEID ; do
            isRun=1
            isReady=0
              while [[ $isReady == 0 ]] ; do
                countStatus=$(curl --header "PRIVATE-TOKEN:9as_okfsbL9DWFxkBKjt" "https://git3.nexdev.net/api/v4/projects/783/pipelines?scope=running" | jq length)
                echo "current job running ${countStatus}"
                if [ $countStatus -lt $TOTALRUNNER ] ;then
              isReady=1
              echo "game name ${i}"
              curl -X POST -F token=f74a05850e77822eae68eb6c359a55 -F ref=5-new-test-base-of-slot-game -F variables[GAMEID]=$i -F variables[ENV]=$ENV -F variables[parentTrigger]=$CI_PIPELINE_ID https://git3.nexdev.net/api/v4/projects/783/trigger/pipeline
              sleep 2
            else
             sleep 20
            fi
                  sleep 2
          done
          done
          fi

        if [[ $isRun == 1 ]] ; then      
        iscompleted=0
        while [[ $iscompleted == 0 ]] ; do
                  countStatus1=$(curl --header "PRIVATE-TOKEN:9as_okfsbL9DWFxkBKjt" "https://git3.nexdev.net/api/v4/projects/783/pipelines?scope=running" | jq length)
                  echo "$countStatus1"
                  if [ $countStatus1 -lt 1 ] ; then
                  iscompleted=1
                    if [ "$GAMEID" == "ALL" ] ;then
                        echo "run all games"
                       totalgames=$(echo -n "$LIST_GAME" | wc -w)
                      latestpipeline=$(curl --header "PRIVATE-TOKEN:9as_okfsbL9DWFxkBKjt" "https://git3.nexdev.net/api/v4/projects/783/pipelines?per_page=${totalgames}"  | jq -r '.[].status') 
                      else
                      totalgames=$(echo -n "$arr" | wc -w)
                        latestpipeline=$(curl --header "PRIVATE-TOKEN:9as_okfsbL9DWFxkBKjt" "https://git3.nexdev.net/api/v4/projects/783/pipelines?per_page=${totalgames}"  | jq -r '.[].status') 
                    fi
                else      
                sleep 30
                  fi
             done
                     jobresult=1   
                     SUB="failed"
                     case $latestpipeline in *"$SUB"*)
                        jobresult=0
                     esac
                      if [ $jobresult == 0 ] ; then
                        echo "job failed"
                        exit 1
                        else
                        echo "job passed"
                        exit 0
                      fi
                                            fi
