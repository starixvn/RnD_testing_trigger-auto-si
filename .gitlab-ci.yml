stages: 
  - testMain

build:
  stage: testMain
  tags:
    - docker-automation-test
  variables:
    LIST_GAME: "TreasureIsland Sedie VIpSedie TurboBigSmall BigSmall MiniSedie BigSmallSicBo BlackJack SedieWar TurboOddEven DragonTiger KenoProMax VipFishPrawnCrab VipBaccarat ThreeCards Lottery FourGuardians SpecialSedie FishPrawnCrab HeroSlot Roulette BitCoin CasinoHPoker HiLo Baccarat TexasHoldEm NightClub"
  script:
    - apk add jq
    - arr=${PRODUCT//,/ }
    - >
      if [ "$PRODUCT" == "ALL" ] ;then
            isRun=1
            isReady=0
            for i in $LIST_GAME ; do
              while [[ $isReady == 0 ]] ; do
                countStatus=$(curl --header "PRIVATE-TOKEN:ue7_6P-5zqsVhraztWxe" "https://git3.nexdev.net/api/v4/projects/253/pipelines?scope=running" | jq length)
                echo "current job running ${countStatus}"
                if [ $countStatus -lt 3 ] ;then
              isReady=1
              echo "game name ${i}"
              curl -X POST -F token=0f21176112256c893237283ca56f7b -F ref=master -F variables[PRODUCT]=$i -F variables[ENV]=$ENV -F variables[parentTrigger]=$CI_PIPELINE_ID  https://git3.nexdev.net/api/v4/projects/253/trigger/pipeline
              sleep 10
            else
             sleep 20
            fi
                  sleep 5
          done
          done
          fi


        if [[ $isRun == 1 ]] ; then      
        iscompleted=0
        while [[ $iscompleted == 0 ]] ; do
                  countStatus1=$(curl --header "PRIVATE-TOKEN:ue7_6P-5zqsVhraztWxe" "https://git3.nexdev.net/api/v4/projects/253/pipelines?scope=running" | jq length)
                  echo "$countStatus1"
                  if [ $countStatus1 -lt 1 ] ; then
                  iscompleted=1
                    if [ "$product" == "all" ] ;then
                        echo "run all games"
                       totalgames=$(echo -n "$LIST_GAME" | wc -w)
                      latestpipeline=$(curl --header "PRIVATE-TOKEN:ue7_6P-5zqsVhraztWxe" "https://git3.nexdev.net/api/v4/projects/253/pipelines?per_page=${totalgames}"  | jq -r '.[].status') 
                      else
                      totalgames=$(echo -n "$arr" | wc -w)
                        latestpipeline=$(curl --header "PRIVATE-TOKEN:ue7_6P-5zqsVhraztWxe" "https://git3.nexdev.net/api/v4/projects/253/pipelines?per_page=${totalgames}"  | jq -r '.[].status') 
                    fi
                else      
                sleep 30
                  fi
             done
                     jobresult=1   
                     SUB="failed"
                     case $latestpipeline in *"$SUB"*)
                        jobresult=0
                     esac
                      if [ $jobresult == 0 ] ; then
                        echo "job failed"
                        exit 1
                        else
                        echo "job passed"
                        exit 0
                      fi
                                            fi
